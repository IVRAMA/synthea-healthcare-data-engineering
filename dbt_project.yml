name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
macro-paths: ["macros"]

on-run-start:
  - "{{ apply_fhir_schema_drift() }}"

models:
  my_new_project:
    00_hdb_pipeline:
      loading:
        +database: HDB
        +schema: LOADING
      staging:
        +database: HDB
        +schema: STAGING
        +materialized: incremental
    01_bronze:
      healthcare_csv:
        +database: HCB
        +schema: bronze
        +materialized: table
      healthcare_sfk:
        +database: HJB
        +schema: bronze
        +materialized: table
    02_silver:
      healthcare_csv:
        +database: HCB
        +schema: silver
        +materialized: view
      healthcare_sfk:
        +database: HJB
        +schema: silver
        +materialized: view
      +database: HEALTHCARE_ANALYTICS_NEW
      +schema: silver
      +materialized: table
